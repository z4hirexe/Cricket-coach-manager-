name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME ($CODE)"

      - name: Unit tests (engine, delivery planner, modes)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload UI screenshots (Robolectric + Roborazzi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: docs/previews/screens/*.png
          if-no-files-found: ignore

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cmp-release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/cmp-release.keystore" >> "$GITHUB_ENV"
            echo "Release signing key loaded."
          else
            echo "No signing secret available (e.g. fork PR); building unsigned."
          fi

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Rename APK
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "out/CricketManagerPro-${{ steps.ver.outputs.name }}-build${{ github.run_number }}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "out/CricketManagerPro-${{ steps.ver.outputs.name }}-build${{ github.run_number }}.apk"
          fi
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricketManagerPro-${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish pre-release (direct download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Cricket Manager Pro ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})"
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body: |
            Automatic build from commit ${{ github.sha }}.
            Version ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }}).
            Download the APK below and install it on Android 8.0+ (allow "Install unknown apps").
